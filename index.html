<!DOCTYPE html>
<html lang="es" data-theme="umbral" data-app="hub">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#121a24" />
<title>FANECT — Tribuna Segura</title>
<script>
/* Default theme is umbral. Restore the last route before CSS paints. */
(function () {
  try {
    var t = localStorage.getItem("fanect_theme");
    var colors = { umbral: "#121a24", vinculo: "#0e1628", pulso: "#120c16" };
    if (colors[t]) {
      document.documentElement.setAttribute("data-theme", t);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", colors[t]);
    }
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
